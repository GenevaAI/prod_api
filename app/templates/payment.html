<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Details</title>
  <script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { background: #0070ba; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #paypal-button-container { margin-top: 24px; }
    .error { color: #c00; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Payment Details - Ahmed's Python Website</h1>

  <form id="payment-form">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" id="first_name" required />
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input type="text" id="last_name" required />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label>Address Line 1</label>
      <input type="text" id="address_line_1" required />
    </div>
    <div class="form-group">
      <label>Address Line 2 (optional)</label>
      <input type="text" id="address_line_2" />
    </div>
    <div class="form-group">
      <label>City</label>
      <input type="text" id="city" required />
    </div>
    <div class="form-group">
      <label>State / Province</label>
      <input type="text" id="state" required />
    </div>
    <div class="form-group">
      <label>Postal Code</label>
      <input type="text" id="postal_code" required />
    </div>
    <div class="form-group">
      <label>Country</label>
      <select id="country_code">
        <option value="CH">Switzerland</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="GB">United Kingdom</option>
      </select>
    </div>
    <div class="form-group">
      <label>Amount (CHF)</label>
      <input type="number" id="amount" value="29.99" step="0.01" min="0.01" required />
    </div>

    <button type="submit" id="submit-btn">Continue to PayPal (Sandbox - No payment really takes place)</button>
    <div id="error" class="error"></div>
  </form>

  <div id="paypal-button-container" style="display:none;"></div>

  <script>
    const form = document.getElementById("payment-form");
    const errorDiv = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const paypalContainer = document.getElementById("paypal-button-container");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating order…";

      const payload = {
        amount: document.getElementById("amount").value,
        currency: "USD",
        description: "Order from my shop",
        payer: {
          first_name: document.getElementById("first_name").value,
          last_name: document.getElementById("last_name").value,
          email: document.getElementById("email").value,
          address_line_1: document.getElementById("address_line_1").value,
          address_line_2: document.getElementById("address_line_2").value || null,
          city: document.getElementById("city").value,
          state: document.getElementById("state").value,
          postal_code: document.getElementById("postal_code").value,
          country_code: document.getElementById("country_code").value,
        }
      };

      try {
        const res = await fetch("/paypal/create-paypal-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Failed to create order");
        }

        const data = await res.json();
        const orderId = data.order_id;

        // Hide form and show PayPal buttons
        form.style.display = "none";
        paypalContainer.style.display = "block";

        paypal.Buttons({
          createOrder: () => orderId,   // we already created it on the server
          onApprove: async (data) => {
            // Capture the payment
            const captureRes = await fetch(`/paypal/capture-paypal-order/${data.orderID}`, {
              method: "POST",
            });
            if (captureRes.ok) {
              window.location.href = "/payment-success";  // show success message
            } else {
              alert("Payment capture failed");
            }
          },
          onError: (err) => {
            console.error(err);
            errorDiv.textContent = "PayPal error occurred";
          }
        }).render("#paypal-button-container");

      } catch (err) {
        errorDiv.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue to PayPal";
      }
    });
  </script>
</body>
</html>
